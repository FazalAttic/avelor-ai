name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    name: Lint, Typecheck & Storefront Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check code formatting and linting
        run: bun run check

      - name: Build storefront
        run: bun run build

  test:
    name: Automated Test Suite (PostgreSQL & Redis)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: avelor_dev
          POSTGRES_USER: avelor
          POSTGRES_PASSWORD: avelor
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://avelor:avelor@localhost:5433/avelor_dev
      CACHE_URL: redis://localhost:6379
      REDIS_URL: redis://localhost:6379
      AUTH_SECRET: dev_auth_secret_ci_32_characters_random_minimum
      AUTH_URL: http://localhost:5000
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1
      PORT: 5000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Initialize PostgreSQL extensions
        run: |
          docker exec $(docker ps -q -f ancestor=pgvector/pgvector:pg16) psql -U avelor -d avelor_dev -c 'CREATE EXTENSION IF NOT EXISTS vector; CREATE EXTENSION IF NOT EXISTS "uuid-ossp";'

      - name: Push Database Schema
        run: bun run db:push

      - name: Run Test Suite
        run: bun test
